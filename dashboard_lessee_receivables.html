<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد ذمم المستأجرين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f0f4f8;--bg2:#e2e8f0;--card:#ffffff;--card2:#f8fafc;
  --border:#cbd5e1;--border2:#94a3b8;
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:rgba(201,168,76,.12);
  --red:#f87171;--red2:#dc2626;--redl:rgba(248,113,113,.13);
  --green:#4ade80;--green2:#16a34a;--greenl:rgba(74,222,128,.13);
  --text:#1e293b;--text2:#475569;--text3:#64748b;--text4:#94a3b8;
  --shadow:0 4px 24px rgba(0,0,0,.08);
  --radius2:10px;--radius3:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:13px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:11px 24px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;box-shadow:0 3px 12px rgba(201,168,76,.3)}
.brand-txt h1{font-family:'Tajawal',sans-serif;font-size:17px;font-weight:800;color:var(--gold2);line-height:1.2}
.brand-txt p{font-size:11px;color:var(--text4)}
.header-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta-pill{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;text-align:center;min-width:120px}
.meta-pill .lbl{font-size:10px;color:var(--text4);font-weight:600}
.meta-pill .val{font-size:12.5px;font-weight:800;color:var(--text2);font-family:'Tajawal',sans-serif;direction:ltr}
.update-pill{background:var(--gold3);border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:6px 14px;text-align:center}
.update-pill .lbl{font-size:10px;color:var(--gold);font-weight:600}
.update-pill .val{font-size:13px;font-weight:800;color:var(--gold2);font-family:'Tajawal',sans-serif}
.nav{display:flex;padding:0 24px;border-top:1px solid var(--bg2);background:#fff;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tab{padding:13px 22px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--text2);background:var(--bg2)}
.tab.active{color:var(--gold2);border-bottom-color:var(--gold);font-weight:800}
.tab-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.main{padding:20px 24px;max-width:1600px;margin:0 auto}
.screen{display:none}
.screen.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;color:var(--text);margin:22px 0 12px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.subsection-title{font-family:'Tajawal',sans-serif;font-size:13.5px;font-weight:800;color:var(--text2);margin:18px 0 10px;display:flex;align-items:center;gap:7px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;position:relative;overflow:hidden;transition:box-shadow .2s}
.kpi-card:hover{box-shadow:var(--shadow)}
.kpi-icon{font-size:20px;margin-bottom:6px}
.kpi-label{font-size:11.5px;color:var(--text3);font-weight:600;margin-bottom:5px;line-height:1.4}
.kpi-value{font-family:'Tajawal',sans-serif;font-size:19px;font-weight:900;color:var(--text);line-height:1;direction:ltr;text-align:right}
.kpi-sub{font-size:10.5px;color:var(--text4);margin-top:3px}
.kpi-accent{position:absolute;bottom:0;left:0;right:0;height:3px}
.gauges-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.gauge-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;display:flex;align-items:center;gap:12px}
.gauge-wrap{position:relative;width:70px;height:70px;flex-shrink:0}
.gauge-wrap svg{transform:rotate(-90deg)}
.gauge-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-pct{font-family:'Tajawal',sans-serif;font-size:14px;font-weight:900;line-height:1;direction:ltr}
.gauge-lbl2{font-size:9px;color:var(--text4);font-weight:600}
.gauge-info .g-title{font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:2px}
.gauge-info .g-sub{font-size:10.5px;color:var(--text3);direction:ltr;text-align:right}
.charts-row{display:grid;gap:14px;margin-bottom:16px}
.charts-row.cols3{grid-template-columns:0.82fr 1.36fr 0.82fr}
.charts-row.cols2{grid-template-columns:1fr 1fr}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.chart-card h3{font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;color:var(--text);margin-bottom:12px}
.chart-card h3.has-sub{margin-bottom:2px}
.chart-card .chart-sub{font-size:10.5px;color:var(--text4);font-weight:600;margin-bottom:10px}
.chart-note{font-size:10.5px;color:var(--text4);margin-top:8px;text-align:center}
.chart-card.full-width{grid-column:1/-1}
.chart-wrap{position:relative}
.table-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden;margin-bottom:16px}
.table-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.table-header h3{font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;color:var(--text)}
.table-wrap{overflow-x:auto;max-height:520px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg2);color:var(--text2);font-weight:700;padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);font-size:11px;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--bg2);color:var(--text);white-space:nowrap}
td.num{direction:ltr;text-align:right;font-family:'Tajawal',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--card2)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;border:1px solid}
.badge-red{background:var(--redl);color:var(--red2);border-color:rgba(220,38,38,.2)}
.badge-green{background:var(--greenl);color:var(--green2);border-color:rgba(22,163,74,.2)}
.badge-amber{background:rgba(245,158,11,.13);color:#b45309;border-color:rgba(245,158,11,.3)}
.filter-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.filter-bar label{font-size:12px;font-weight:700;color:var(--text3)}
.filter-select{font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;border:1px solid var(--border);border-radius:var(--radius3);padding:7px 12px;background:var(--card);color:var(--text);cursor:pointer;min-width:190px}
.filter-select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.15)}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-reset{font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;background:none;border:1px solid var(--border);border-radius:var(--radius3);padding:7px 14px;color:var(--text3);cursor:pointer;transition:all .18s}
.filter-reset:hover{border-color:var(--gold);color:var(--gold2)}
.export-btn{font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;border:none;border-radius:var(--radius3);padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .18s;white-space:nowrap}
.export-btn:hover{box-shadow:0 4px 12px rgba(30,41,59,.3);transform:translateY(-1px)}
.empty-state{text-align:center;padding:40px;color:var(--text3);font-size:14px}
.active-filter-note{font-size:11.5px;color:var(--gold);background:var(--gold3);border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:5px 12px;font-weight:700}
@media(max-width:768px){.main{padding:14px}.kpi-grid{grid-template-columns:repeat(2,1fr)}.charts-row.cols2,.charts-row.cols3{grid-template-columns:1fr}.header-meta{display:none}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">⚖️</div>
      <div class="brand-txt">
        <h1>داشبورد ذمم المستأجرين</h1>
        <p>تحليل الذمم القانونية وغير القانونية</p>
      </div>

    <div class="header-meta">
      <div class="meta-pill"><div class="lbl">عدد العقود المدينة</div><div class="val" id="hdr-count">—</div></div>

    </div>

    <button class="tab active" onclick="showScreen('legal_yes')" data-screen="legal_yes"><span class="tab-dot" style="background:#dc2626"></span>الحالة القانونية: نعم</button>
    <button class="tab" onclick="showScreen('legal_no')" data-screen="legal_no"><span class="tab-dot" style="background:#16a34a"></span>الحالة القانونية: لا</button>
  </nav>
</div>
<div class="main">

    </div>
    <div class="filter-group">
      <label>من شهر</label>
      <select class="filter-select" id="f-from" onchange="onFilterChange()" style="min-width:150px"><option value="">—</option></select>
    </div>
    <div class="filter-group">
      <label>إلى شهر</label>
      <select class="filter-select" id="f-to" onchange="onFilterChange()" style="min-width:150px"><option value="">—</option></select>
    </div>
    <button class="filter-reset" onclick="resetFilters()">↺ إعادة تعيين</button>
    <span class="active-filter-note" id="filter-note" style="display:none"></span>
  </div>
  <div class="screen active" id="screen-legal_yes"></div>
  <div class="screen" id="screen-legal_no"></div>
</div>

const DATA_ASOF = "أغسطس 2026";
const ASOF_YEAR = 2026;
const UPDATE_DATE = "24 أغسطس 2026";
const ROWS = COMPACT.slice(1).map(arr=>{
  const o={}; FIELDS.forEach((f,i)=>o[f]=arr[i]); return o;
});

const MONTH_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function ymLabel(ym){ const [y,m]=ym.split('-').map(Number); return MONTH_AR[m-1]+' '+y; }
function ymCompare(a,b){ return a<b?-1:(a>b?1:0); }

// ── portfolio list + fixed categorical colors (validated CVD-safe set) ──
const PORT_COLOR_SET = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#06b6d4','#f97316','#ec4899','#14b8a6'];
const PORTFOLIOS = Array.from(new Set(ROWS.map(r=>r.portfolio))).sort();
const PORT_COLOR = {};
PORTFOLIOS.forEach((p,i)=>PORT_COLOR[p]=PORT_COLOR_SET[i%PORT_COLOR_SET.length]);

// ── short display labels (portfolio numbers / long legal-entity names are dropped in the UI) ──
const PORT_SHORT_MAP = {
  '1 - أسواق القرين':'القرين', '2 - مجمعات العقيلة':'العقيلة', '3 - أسواق العارضية':'العارضية',
  '4 - العقارات السكنية':'السكني', '5 - العقارات التجارية':'التجاري', '8 - أملاك خاصة':'ملك خاص',
};
function shortPortfolio(p){ return PORT_SHORT_MAP[p] || (p||'').replace(/^\d+\s*-\s*/,''); }
const OWNER_SHORT_MAP = [
  ['الإنشاءات الشرقية','الانشاءات'],
  ['جزيرة وربة','جزيرة وربة'],
  ['جزيرة عوهه','جزيرة عوهه'],
  ['قاروه','قاروه'],
];
function shortOwner(o){
  if(!o) return '—';
  return o.split(' , ').map(part=>{
    const hit=OWNER_SHORT_MAP.find(([k])=>part.includes(k));
    return hit?hit[1]:part.trim();
  }).join(' / ');
}

// ── FORMAT ──────────────────────────────────────────────────────────
function fmtSmart(n){
  if(n===null||n===undefined) return '—';
  const abs=Math.abs(n);
  if(abs>=1e6)  return (n/1e6).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'M';
  if(abs>=1000) return (n/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'K';
  return n.toLocaleString('en-US',{maximumFractionDigits:0});
}
function fmtChartK(n){
  if(Math.abs(n)>=1e6)  return (n/1e6).toFixed(1)+'M';
  if(Math.abs(n)>=1000) return Math.round(n/1000)+'K';
  return String(Math.round(n));
}
const fmtN = n=>(n===null||n===undefined)?'—':n.toLocaleString('en-US',{maximumFractionDigits:0});
const fmtPct = n=>(n===null||n===undefined)?'—':(n*100).toFixed(1)+'%';
const fmtPctN = n=>n?Math.round(n*100):0;
const fmtDate = s=>{ if(!s) return '—'; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };

// ── month universe & selects ─────────────────────────────────────────
const ALL_MONTHS = Array.from(new Set(ROWS.flatMap(r=>r.alloc.map(a=>a[0])))).sort(ymCompare);
function populateMonthSelects(){
  const fromSel=document.getElementById('f-from'), toSel=document.getElementById('f-to');
  const desc=ALL_MONTHS.slice().reverse(); // newest → oldest, per user preference
  desc.forEach(ym=>{
    const o1=document.createElement('option'); o1.value=ym; o1.textContent=ymLabel(ym); fromSel.appendChild(o1);
    const o2=document.createElement('option'); o2.value=ym; o2.textContent=ymLabel(ym); toSel.appendChild(o2);
  });
}
function populatePortfolioSelect(){
  const sel=document.getElementById('f-portfolio');
  PORTFOLIOS.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=shortPortfolio(p); sel.appendChild(o); });
}

// ── filter state ────────────────────────────────────────────────────
function getFilters(){
  const portfolio=document.getElementById('f-portfolio').value||null;
  let from=document.getElementById('f-from').value||null;
  let to=document.getElementById('f-to').value||null;
  if(from && to && ymCompare(from,to)>0){ [from,to]=[to,from]; }
  return {portfolio,from,to};
}
function resetFilters(){
  document.getElementById('f-portfolio').value='';
  document.getElementById('f-from').value='';
  document.getElementById('f-to').value='';
  onFilterChange();
}
function onFilterChange(){
  const {portfolio,from,to}=getFilters();
  const note=document.getElementById('filter-note');
  const parts=[];
  if(portfolio) parts.push('المحفظة: '+shortPortfolio(portfolio));
  if(from||to) parts.push('الفترة: '+(from?ymLabel(from):'البداية')+' → '+(to?ymLabel(to):'النهاية'));
  if(parts.length){ note.style.display='inline-block'; note.textContent='🔎 '+parts.join(' | '); }
  else { note.style.display='none'; }
  renderAll();
}

// ── per-row helpers respecting month range ─────────────────────────
function rowAllocInRange(row,from,to){
  if(!from && !to) return row.alloc;
  return row.alloc.filter(([ym])=> (!from||ymCompare(ym,from)>=0) && (!to||ymCompare(ym,to)<=0) );
}
function rowDebtInRange(row,from,to){
  if(!from && !to) return row.debt;
  return rowAllocInRange(row,from,to).reduce((s,[,a])=>s+a,0);
}
function rowMonthsInRange(row,from,to){
  if(!from && !to) return row.months_overdue;
  return rowAllocInRange(row,from,to).length;
}

function baseRows(table,legal,portfolio){
  return ROWS.filter(r=>r.table===table && r.legal===legal && (!portfolio||r.portfolio===portfolio));
}
function scopedRows(table,legal,portfolio,from,to){
  const rows=baseRows(table,legal,portfolio);
  if(!from && !to) return rows.map(r=>({row:r,debt:r.debt,months:r.months_overdue}));
  return rows.map(r=>({row:r,debt:rowDebtInRange(r,from,to),months:rowMonthsInRange(r,from,to)}))
             .filter(x=>x.debt>0.005);
}
function sumDebt(scoped){ return scoped.reduce((s,x)=>s+x.debt,0); }

// ── COMPONENTS (kpi / gauge / bar) ─────────────────────────────────
function kpi(icon,label,val,sub,accent){
  return `<div class="kpi-card">
    <div class="kpi-icon">${icon}</div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${val}</div>
    <div class="kpi-sub">${sub||''}</div>
    <div class="kpi-accent" style="background:${accent}"></div>
  </div>`;
}
function gauge(pct,label,color,sub){
  const r=28,cx=35,cy=35,c=2*Math.PI*r,f=c*(Math.min(pct,100)/100);
  return `<div class="gauge-card">
    <div class="gauge-wrap">
      <svg width="70" height="70" viewBox="0 0 70 70">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="6"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
          stroke-dasharray="${f} ${c}" stroke-linecap="round"/>
      </svg>
      <div class="gauge-text">
        <div class="gauge-pct" style="color:${color}">${pct}%</div>
        <div class="gauge-lbl2">من الإجمالي</div>
      </div>
    </div>
    <div class="gauge-info"><div class="g-title">${label}</div><div class="g-sub">${sub}</div></div>
  </div>`;
}

const activeCharts = {};
function destroyChart(id){ if(activeCharts[id]){ activeCharts[id].destroy(); delete activeCharts[id]; } }

function barChart(id,labels,vals,colors,labelFn){
  if(typeof Chart==='undefined') return;
  destroyChart(id);
  const ctx=document.getElementById(id); if(!ctx) return;
  if(!labels.length){ return; }
  activeCharts[id]=new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{data:vals,backgroundColor:colors,borderRadius:4,borderSkipped:false,maxBarThickness:26}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>labelFn?labelFn(c.parsed.y):c.parsed.y}}},
      scales:{x:{grid:{display:false},ticks:{font:{family:'Cairo',size:10.5},color:'#64748b',autoSkip:false,maxRotation:40,minRotation:0}},y:{display:false,beginAtZero:true}},
      layout:{padding:{top:28}},
    },
    plugins:[{id:'dl',afterDatasetsDraw(chart){
      const {ctx:c}=chart;
      chart.data.datasets.forEach((ds,di)=>{
        chart.getDatasetMeta(di).data.forEach((bar,i)=>{
          const v=ds.data[i]; if(!v) return;
          const txt=labelFn?labelFn(v):String(v);
          c.save();c.font='bold 10.5px Cairo';c.fillStyle='#1e293b';c.textAlign='center';
          c.fillText(txt,bar.x,bar.y-7);c.restore();
        });
      });
    }}]
  });
}

// month chart: two-line label (count + value)
function monthChart(id,labels,vals,counts,color){
  if(typeof Chart==='undefined') return;
  destroyChart(id);
  const ctx=document.getElementById(id); if(!ctx) return;
  if(!labels.length){ return; }
  activeCharts[id]=new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{data:vals,backgroundColor:color,borderRadius:4,borderSkipped:false,maxBarThickness:30}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:c=>c[0].label,
        label:c=>[`عدد العقود: ${fmtN(counts[c.dataIndex])}`,`القيمة: ${fmtSmart(c.parsed.y)}`]
      }}},
      scales:{x:{grid:{display:false},ticks:{font:{family:'Cairo',size:11},color:'#64748b'}},y:{display:false,beginAtZero:true}},
      layout:{padding:{top:40}},
    },
    plugins:[{id:'dl2',afterDatasetsDraw(chart){
      const {ctx:c}=chart;
      chart.getDatasetMeta(0).data.forEach((bar,i)=>{
        if(!vals[i]) return;
        c.save();c.textAlign='center';
        c.font='bold 10.5px Cairo';c.fillStyle='#1e293b';
        c.fillText(fmtSmart(vals[i]),bar.x,bar.y-19);
        c.font='700 9.5px Cairo';c.fillStyle='#94a3b8';
        c.fillText(counts[i]+' عقد',bar.x,bar.y-7);
        c.restore();
      });
    }}]
  });
}

// ── aggregations ────────────────────────────────────────────────────
function aggByPortfolio(scoped){
  const m={};
  scoped.forEach(x=>{ m[x.row.portfolio]=(m[x.row.portfolio]||0)+x.debt; });
  const keys=Object.keys(m).sort((a,b)=>m[b]-m[a]);
  return {labels:keys.map(shortPortfolio), vals:keys.map(l=>m[l]), colors:keys.map(l=>PORT_COLOR[l])};
}
function aggByYear(scoped,from,to){
  const m={};
  scoped.forEach(x=>{
    const alloc=rowAllocInRange(x.row,from,to);
    alloc.forEach(([ym,amt])=>{ const y=ym.slice(0,4); m[y]=(m[y]||0)+amt; });
  });
  const labels=Object.keys(m).sort();
  return {labels, vals:labels.map(l=>m[l])};
}
function aggByClosingYear(scoped){
  const val={}, cnt={};
  scoped.forEach(x=>{
    const y=x.row.last_month.slice(0,4);
    val[y]=(val[y]||0)+x.debt;
    cnt[y]=(cnt[y]||0)+1;
  });
  const years=Object.keys(val).sort();
  const labels=years.map(y=>y===String(ASOF_YEAR)?y+'*':y);
  return {labels, vals:years.map(y=>val[y]), counts:years.map(y=>cnt[y])};
}
function aggByMonth2026(scoped,from,to){
  const val={}, cnt={};
  scoped.forEach(x=>{
    const alloc=rowAllocInRange(x.row,from,to).filter(([ym])=>ym.startsWith(String(ASOF_YEAR)+'-'));
    let has=false;
    alloc.forEach(([ym,amt])=>{ val[ym]=(val[ym]||0)+amt; has=true; });
    if(has){ const yms=new Set(alloc.map(a=>a[0])); yms.forEach(ym=>{ cnt[ym]=(cnt[ym]||0)+1; }); }
  });
  const labels=Object.keys(val).sort();
  return {labels:labels.map(ymLabel), raw:labels, vals:labels.map(l=>val[l]), counts:labels.map(l=>cnt[l]||0)};
}

// ── tables ──────────────────────────────────────────────────────────
function statusBadge(s){
  if(s==='العقد سارى') return `<span class="badge badge-green">سارٍ</span>`;
  if(s==='العقد منتهى') return `<span class="badge badge-amber">منتهي</span>`;
  if(s==='العقد مغلق') return `<span class="badge badge-red">مغلق</span>`;
  return s||'—';
}

  }).join('');
  return head+'<tbody>'+body+'</tbody>';
}
function buildTable2Html(scoped,portfolioFiltered,rangeActive){

  }
  const head='<thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead>';
  const body=scoped.map(x=>{
    const r=x.row;
    let cells=[shortOwner(r.owner), ...(portfolioFiltered?[]:[shortPortfolio(r.portfolio)]), r.property, r.contract_no, r.tenant, statusBadge(r.status), fmtDate(r.end_date), fmtDate(r.close_date)];
    if(rangeActive){
      cells.push(x.months, `<span class="num">${fmtN(r.monthly_rent)}</span>`, `<span class="num">${fmtN(x.debt)}</span>`);

  }).join('');
