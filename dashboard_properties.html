<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل معلومات العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f0f4f8;--bg2:#e2e8f0;--card:#ffffff;--card2:#f8fafc;
  --border:#cbd5e1;--border2:#94a3b8;
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:rgba(201,168,76,.12);
  --red:#f87171;--red2:#dc2626;--redl:rgba(248,113,113,.13);
  --green:#4ade80;--green2:#16a34a;--greenl:rgba(74,222,128,.13);
  --text:#1e293b;--text2:#475569;--text3:#64748b;--text4:#94a3b8;
  --shadow:0 4px 24px rgba(0,0,0,.08);
  --radius2:10px;--radius3:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:13px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:11px 24px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;box-shadow:0 3px 12px rgba(201,168,76,.3)}
.brand-txt h1{font-family:'Tajawal',sans-serif;font-size:17px;font-weight:800;color:var(--gold2);line-height:1.2}
.brand-txt p{font-size:11px;color:var(--text4)}
.header-meta{display:flex;align-items:center;gap:10px}
.meta-pill{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;text-align:center;min-width:120px}
.meta-pill .lbl{font-size:10px;color:var(--text4);font-weight:600}
.meta-pill .val{font-size:12.5px;font-weight:800;color:var(--text2);font-family:'Tajawal',sans-serif;direction:ltr}
.update-pill{background:var(--gold3);border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:6px 14px;text-align:center}
.update-pill .lbl{font-size:10px;color:var(--gold);font-weight:600}
.update-pill .val{font-size:13px;font-weight:800;color:var(--gold2);font-family:'Tajawal',sans-serif}
.nav{display:flex;padding:0 24px;border-top:1px solid var(--bg2);background:#fff;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text2);background:var(--bg2)}
.tab.active{color:var(--gold2);border-bottom-color:var(--gold);font-weight:700}
.tab-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.main{padding:20px 24px;max-width:1600px;margin:0 auto}
.screen{display:none}
.screen.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;color:var(--text);margin:20px 0 12px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;position:relative;overflow:hidden;transition:box-shadow .2s}
.kpi-card:hover{box-shadow:var(--shadow)}
.kpi-card-clickable{cursor:pointer}
.kpi-card-clickable:hover{box-shadow:var(--shadow);transform:translateY(-1px);transition:all .15s}
.kpi-icon{font-size:20px;margin-bottom:6px}
.kpi-label{font-size:11.5px;color:var(--text3);font-weight:600;margin-bottom:5px;line-height:1.4}
.kpi-value{font-family:'Tajawal',sans-serif;font-size:20px;font-weight:900;color:var(--text);line-height:1;direction:ltr;text-align:right}
.kpi-sub{font-size:10.5px;color:var(--text4);margin-top:3px}
.kpi-accent{position:absolute;bottom:0;left:0;right:0;height:3px}
.gauges-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.gauge-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;display:flex;align-items:center;gap:12px}
.gauge-wrap{position:relative;width:70px;height:70px;flex-shrink:0}
.gauge-wrap svg{transform:rotate(-90deg)}
.gauge-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-pct{font-family:'Tajawal',sans-serif;font-size:14px;font-weight:900;line-height:1;direction:ltr}
.gauge-lbl2{font-size:9px;color:var(--text4);font-weight:600}
.gauge-info .g-title{font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:2px}
.gauge-info .g-sub{font-size:10.5px;color:var(--text3);direction:ltr;text-align:right}
.charts-row{display:grid;gap:14px;margin-bottom:16px}
.charts-row.cols2{grid-template-columns:1fr 1fr}
.charts-row.cols3{grid-template-columns:1fr 1fr 1fr}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.chart-card h3{font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;color:var(--text);margin-bottom:12px}
.chart-wrap{position:relative}
.table-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden;margin-bottom:16px}
.table-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.table-header h3{font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;color:var(--text)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg2);color:var(--text2);font-weight:700;padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);font-size:11px}
td{padding:8px 12px;border-bottom:1px solid var(--bg2);color:var(--text);white-space:nowrap}
td.num{direction:ltr;text-align:right;font-family:'Tajawal',sans-serif;font-weight:700}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--card2)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;border:1px solid}
.badge-red{background:var(--redl);color:var(--red2);border-color:rgba(220,38,38,.2)}
.badge-green{background:var(--greenl);color:var(--green2);border-color:rgba(22,163,74,.2)}
.badge-amber{background:rgba(245,158,11,.13);color:#b45309;border-color:rgba(245,158,11,.3)}
.pct-bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:5px}
.pct-fill{height:100%;border-radius:3px}
.filter-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-bar label{font-size:12px;font-weight:700;color:var(--text3)}
.filter-select{font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;border:1px solid var(--border);border-radius:var(--radius3);padding:7px 12px;background:var(--card);color:var(--text);cursor:pointer;min-width:220px}
.filter-select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.15)}
.filter-reset{font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;background:none;border:1px solid var(--border);border-radius:var(--radius3);padding:7px 14px;color:var(--text3);cursor:pointer;transition:all .18s}
.filter-reset:hover{border-color:var(--gold);color:var(--gold2)}
.portfolio-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;border-radius:20px;padding:5px 14px;border:1px solid}
.year-compare-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.year-compare-bar label{font-size:12px;font-weight:700;color:var(--text3)}
.year-select{font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;border:1px solid var(--border);border-radius:var(--radius3);padding:7px 12px;background:var(--card);color:var(--text);cursor:pointer;min-width:110px}
.compare-btn{font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border:none;border-radius:var(--radius3);padding:8px 20px;cursor:pointer;transition:all .18s}
.compare-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(201,168,76,.35)}
.export-btn{font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;border:none;border-radius:var(--radius3);padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .18s;white-space:nowrap}
.export-btn:hover{box-shadow:0 4px 12px rgba(30,41,59,.3);transform:translateY(-1px)}
.empty-state{text-align:center;padding:40px;color:var(--text3);font-size:14px}
/* تصفية الوحدات الخالية حسب الدور (قائمة منسدلة متعددة الاختيار) — أُضيفت سبتمبر 2026 */
.ms-wrap{position:relative}
.ms-btn{min-width:190px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ms-menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius3);box-shadow:0 10px 28px rgba(30,41,59,.14);padding:8px;z-index:60;min-width:190px}
.ms-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap}
.ms-item:hover{background:var(--card2)}
.ms-item input{accent-color:var(--gold);cursor:pointer}
@media(max-width:768px){.main{padding:14px}.kpi-grid{grid-template-columns:repeat(2,1fr)}.charts-row.cols2,.charts-row.cols3{grid-template-columns:1fr}.header-meta{display:none}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">🏢</div>
      <div class="brand-txt">
        <h1>تحليل معلومات العقارات</h1>
        <p>لوحة بيانات المحافظ العقارية</p>
      </div>
    </div>
    <div class="header-meta">
      <div class="meta-pill"><div class="lbl">إجمالي القسائم</div><div class="val" id="hdr-total">—</div></div>

      <div class="update-pill"><div class="lbl">📅 تاريخ التحديث</div><div class="val" id="hdr-update-date">—</div></div>
    </div>
  </div>
  <nav class="nav">
    <button class="tab active" onclick="showScreen('main')" data-screen="main">🏠 الرئيسية</button>
    <button class="tab" onclick="showScreen('p_qurein')"   data-screen="p_qurein"><span class="tab-dot" style="background:#3b82f6"></span>القرين</button>

    <button class="tab" onclick="showScreen('p_sokni')"    data-screen="p_sokni"><span class="tab-dot" style="background:#8b5cf6"></span>السكني</button>
    <button class="tab" onclick="showScreen('p_tijari')"   data-screen="p_tijari"><span class="tab-dot" style="background:#06b6d4"></span>التجاري</button>
    <button class="tab" onclick="showScreen('p_fadha')"    data-screen="p_fadha"><span class="tab-dot" style="background:#f97316"></span>أراضي فضاء والمنطقة الحرة</button>
  </nav>
</div>

</div>

// ── FORMAT ──────────────────────────────────────────────────────────
// Smart number: auto M or K, no unit suffix
function fmtSmart(n){
  if(n===null||n===undefined) return '—';
  const abs=Math.abs(n);
  if(abs>=1e6)  return (n/1e6).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'M';
  if(abs>=1000) return (n/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'K';
  return n.toLocaleString('en-US',{maximumFractionDigits:0});
}
// Chart labels: always approx K, rounded to integer K
function fmtChartK(n){
  if(n>=1e6)  return (n/1e6).toFixed(1)+'M';
  if(n>=1000) return Math.round(n/1000)+'K';
  return String(Math.round(n));
}
const fmtN   = n=>(n===null||n===undefined)?'—':n.toLocaleString('en-US',{maximumFractionDigits:0});
const fmtPct = n=>(n===null||n===undefined)?'—':(n*100).toFixed(1)+'%';
const fmtPct2= n=>(n===null||n===undefined)?'—':(n*100).toFixed(2)+'%';
const fmtPctN= n=>n?Math.round(n*100):0;

// ── STATS ────────────────────────────────────────────────────────────
function portStats(rows){
  let count=0,val=0,mortCount=0,mortVal=0,freeCount=0,freeVal=0;
  let unitsR=0,unitsV=0,rentM=0,rentMV=0,totalM=0,totalAA=0;
  rows.forEach(r=>{
    count    += r.عدد_قسائم||1;
    val      += r.تقييم_2025||0;
    mortCount+= r.عدد_مرهونة||0;
    mortVal  += r.قيمة_المرهونة||0;
    freeCount+= r.عدد_غير_مرهونة||0;
    freeVal  += r.قيمة_غير_المرهونة||0;
    unitsR   += r.وحدات_مؤجرة||0;
    unitsV   += r.وحدات_خالية||0;
    rentM    += r.ايجار_شهري_مؤجر||0;
    rentMV   += r.ايجار_شهري_خالي||0;
    totalM   += r.اجمالي_ايجار_شهري||0;
    totalAA  += r.ايجار_سنوي_مؤجر||0;
  });
  const totalU=unitsR+unitsV;
  return {
    count,val,mortCount,mortVal,freeCount,freeVal,
    mortPctCount:count?mortCount/count:0,
    mortPctVal  :val  ?mortVal/val    :0,
    freePctCount:count?freeCount/count:0,
    freePctVal  :val  ?freeVal/val    :0,
    unitsR,unitsV,totalU,rentM,rentMV,totalM,
    occUnit:totalU?unitsR/totalU:0,
    occInc :totalM?rentM/totalM :0,
    vacInc :totalM?rentMV/totalM:0,
    roi    :val   ?totalAA/val  :0,
  };
}

// إحصاءات الوحدات الخالية (وحسب سبتمبر 2026: والمؤجرة) حسب الأدوار لمجموعة سجلات مُعطاة
// unknown = وحدات خالية بدون أي تفصيل أدوار في المصدر (لا تُهمَل، تُحسب ضمن الإجمالي وتُعرض بشكل منفصل)
// vacRate[دور] = نسبة الخالي لهذا الدور = خالي الدور / (خالي الدور + مؤجر الدور)، null إن كان إجمالي وحدات الدور صفراً
// totalVacRate = نسبة الخالي الإجمالية لكل المجموعة = إجمالي الخالي / (إجمالي الخالي + إجمالي المؤجر)
function floorStats(rows){
  const totals={}, rentTotals={}; FLOOR_COLS.forEach(f=>{totals[f]=0; rentTotals[f]=0;});
  let unknown=0, rentUnknown=0, totalVac=0, totalRent=0;
  rows.forEach(r=>{
    const vac=r.وحدات_خالية||0, rent=r.وحدات_مؤجرة||0;
    totalVac+=vac; totalRent+=rent;
    const hasVacFloor=FLOOR_COLS.some(f=>r[f]!==null&&r[f]!==undefined);
    if(!hasVacFloor){ if(vac>0) unknown+=vac; } else { FLOOR_COLS.forEach(f=>{ totals[f]+=r[f]||0; }); }
    const hasRentFloor=FLOOR_RENT_COLS.some(f=>r[f]!==null&&r[f]!==undefined);
    if(!hasRentFloor){ if(rent>0) rentUnknown+=rent; } else { FLOOR_COLS.forEach((f,i)=>{ rentTotals[f]+=r[FLOOR_RENT_COLS[i]]||0; }); }
  });
  let maxFloor=null,maxVal=0;
  FLOOR_COLS.forEach(f=>{ if(totals[f]>maxVal){maxVal=totals[f];maxFloor=f;} });
  if(unknown>maxVal){maxVal=unknown;maxFloor='__unknown__';}
  const vacRate={};
  FLOOR_COLS.forEach(f=>{ const d=totals[f]+rentTotals[f]; vacRate[f]=d?totals[f]/d:null; });
  const totalVacRate=(totalVac+totalRent)?totalVac/(totalVac+totalRent):null;
  return {totals,rentTotals,unknown,rentUnknown,totalVac,totalRent,maxFloor,maxVal,vacRate,totalVacRate};
}
// تدرج لوني ذهبي حسب شدة القيمة نسبةً لأعلى قيمة في الجدول (heatmap)
function heatColor(v,maxVal){
  if(!v) return 'transparent';
  const t=Math.min(v/(maxVal||1),1);
  const r=Math.round(248+(201-248)*t),g=Math.round(250+(168-250)*t),b=Math.round(252+(76-252)*t);
  return `rgba(${r},${g},${b},${(0.18+0.62*t).toFixed(2)})`;
}
// بناء صفوف/جدول توزيع الأدوار لمجموعة محافظ (تُستخدم في الشاشة الرئيسية وشاشات المحافظ)
function floorTableHtml(entries,maxVal,showTotalCol=true){
  const hasUnknown=entries.some(e=>e.stats.unknown>0);
  const showLabel=entries.length>1;
  const head=`<thead><tr>${showLabel?'<th>المحفظة</th>':''}${FLOOR_COLS.map(f=>`<th>${FLOOR_LABELS[f]}</th>`).join('')}${hasUnknown?'<th>غير محدد الدور</th>':''}${showTotalCol?'<th>إجمالي الخالية</th>':''}<th>٪ الخالي الإجمالية</th><th>الدور الأكثر إشكالية</th></tr></thead>`;
  const body=entries.map(e=>{
    const s=e.stats;
    const cells=FLOOR_COLS.map(f=>{
      const v=s.totals[f], pct=s.vacRate[f];
      const pctHtml=(pct!==null&&pct!==undefined)?`<div style="font-size:10px;font-weight:400;color:var(--text3);margin-top:1px">${fmtPct(pct)}</div>`:'';
      return `<td class="num" style="background:${heatColor(v,maxVal)}"><div>${v?fmtN(v):'—'}</div>${pctHtml}</td>`;
    }).join('');
    const unkCell=hasUnknown?`<td class="num" style="background:${heatColor(s.unknown,maxVal)}">${s.unknown?fmtN(s.unknown):'—'}</td>`:'';
    const totCell=showTotalCol?`<td class="num"><b>${fmtN(s.totalVac)}</b></td>`:'';
    const overallPctCell=`<td class="num"><b>${(s.totalVacRate!==null&&s.totalVacRate!==undefined)?fmtPct(s.totalVacRate):'—'}</b></td>`;
    const worstLbl=s.maxFloor?(s.maxFloor==='__unknown__'?'غير محدد':FLOOR_LABELS[s.maxFloor]):null;
    const worst=worstLbl&&s.maxVal>0?`<span class="badge badge-red">${worstLbl} (${fmtN(s.maxVal)})</span>`:'<span style="color:var(--text4)">—</span>';
    return `<tr>${showLabel?`<td><b>${e.label}</b></td>`:''}${cells}${unkCell}${totCell}${overallPctCell}<td>${worst}</td></tr>`;
  }).join('');
  return head+'<tbody>'+body+'</tbody>';
}

// ── COMPONENTS ───────────────────────────────────────────────────────
function kpi(icon,label,val,sub,accent){
  return `<div class="kpi-card">
    <div class="kpi-icon">${icon}</div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${val}</div>
    <div class="kpi-sub">${sub||''}</div>
    <div class="kpi-accent" style="background:${accent}"></div>
  </div>`;
}

function gauge(pct,label,color,sub){
  const r=28,cx=35,cy=35,c=2*Math.PI*r,f=c*(Math.min(pct,100)/100);
  return `<div class="gauge-card">
    <div class="gauge-wrap">
      <svg width="70" height="70" viewBox="0 0 70 70">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="6"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
          stroke-dasharray="${f} ${c}" stroke-linecap="round"/>
      </svg>
      <div class="gauge-text">
        <div class="gauge-pct" style="color:${color}">${pct}%</div>
        <div class="gauge-lbl2">من الإجمالي</div>
      </div>
    </div>
    <div class="gauge-info"><div class="g-title">${label}</div><div class="g-sub">${sub}</div></div>
  </div>`;
}

function barChart(id,labels,vals,colors,labelFn){
  const ctx=document.getElementById(id); if(!ctx) return;
  new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{data:vals,backgroundColor:colors,borderRadius:6,borderSkipped:false}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>labelFn?labelFn(c.parsed.y):c.parsed.y}}},
      scales:{x:{grid:{display:false},ticks:{font:{family:'Cairo',size:11},color:'#64748b'}},y:{display:false}},
      layout:{padding:{top:30}},
    },
    plugins:[{id:'dl',afterDatasetsDraw(chart){
      const {ctx:c}=chart;
      chart.data.datasets.forEach((ds,di)=>{
        chart.getDatasetMeta(di).data.forEach((bar,i)=>{
          const v=ds.data[i],txt=labelFn?labelFn(v):String(v);
          c.save();c.font='bold 11px Cairo';c.fillStyle='#1e293b';c.textAlign='center';
          c.fillText(txt,bar.x,bar.y-7);c.restore();
        });
      });
    }}]
  });
}

function hBarChart(id,labels,vals,colors,suffix){
  const ctx=document.getElementById(id); if(!ctx) return;
  new Chart(ctx,{
    type:'bar',
    data:{labels,datasets:[{data:vals,backgroundColor:colors,borderRadius:5,borderSkipped:false}]},
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x.toFixed(2)+suffix}}},
      scales:{x:{display:false,max:Math.max(...vals,1)*1.3},y:{grid:{display:false},ticks:{font:{family:'Cairo',size:11},color:'#64748b'}}},
      layout:{padding:{right:55}},
    },
    plugins:[{id:'dl',afterDatasetsDraw(chart){
      const {ctx:c}=chart;
      chart.data.datasets.forEach((ds,di)=>{
        chart.getDatasetMeta(di).data.forEach((bar,i)=>{
          const v=ds.data[i];
          c.save();c.font='bold 11px Cairo';c.fillStyle='#1e293b';c.textAlign='right';
          c.fillText(v.toFixed(2)+suffix,bar.x+50,bar.y+4);c.restore();
        });
      });
    }}]
  });
}

// ── YEAR COMPARE ─────────────────────────────────────────────────────
function buildYrCmp(){
  const y1=document.getElementById('yr1').value, y2=document.getElementById('yr2').value;
  const res=document.getElementById('yr-cmp');
  if(+y2<=+y1){res.innerHTML='<div class="empty-state">⚠️ السنة الثانية يجب أن تكون أكبر من الأولى</div>';return;}
  const rows=YR_DATA.filter(r=>r['تقييم_'+y1]&&r['تقييم_'+y2]);
  const up  =rows.filter(r=>Math.round(r['تقييم_'+y2])>Math.round(r['تقييم_'+y1])).sort((a,b)=>(b['تقييم_'+y2]/b['تقييم_'+y1])-(a['تقييم_'+y2]/a['تقييم_'+y1]));
  const dn  =rows.filter(r=>Math.round(r['تقييم_'+y2])<Math.round(r['تقييم_'+y1])).sort((a,b)=>(a['تقييم_'+y2]/a['تقييم_'+y1])-(b['تقييم_'+y2]/b['تقييم_'+y1]));
  const same=rows.filter(r=>Math.round(r['تقييم_'+y2])===Math.round(r['تقييم_'+y1]));
  const tv1=rows.reduce((s,r)=>s+(r['تقييم_'+y1]||0),0);
  const tv2=rows.reduce((s,r)=>s+(r['تقييم_'+y2]||0),0);
  const diff=tv2-tv1, dp=tv1?diff/tv1:0;
  const head=`<thead><tr><th>#</th><th>المحفظة</th><th>المحفظة الفرعية</th><th>القسيمة</th><th>القطعة</th><th>المساحة</th>
    <th>تقييم ${y1}</th><th>مقيم ${y1}</th><th>تقييم ${y2}</th><th>مقيم ${y2}</th><th>الفارق</th><th>نسبة التغير</th></tr></thead>`;
  const mkRow=(r,i)=>{
    const d=r['تقييم_'+y2]-r['تقييم_'+y1],dp2=r['تقييم_'+y1]?d/r['تقييم_'+y1]:0,isUp=d>0;
    return `<tr><td class="num">${i+1}</td><td>${r.محفظة||'—'}</td><td>${r.محفظة_فرعية||'—'}</td>
    <td class="num"><b>${r.قسيمة||'—'}</b></td><td class="num">${r.قطعة||'—'}</td><td class="num">${fmtN(r.مساحة)}</td>
    <td class="num">${fmtSmart(r['تقييم_'+y1])}</td><td>${r['مقيم_'+y1]||'—'}</td>
    <td class="num">${fmtSmart(r['تقييم_'+y2])}</td><td>${r['مقيم_'+y2]||'—'}</td>
    <td class="num" style="color:${isUp?'#16a34a':'#dc2626'};font-weight:800">${isUp?'+':''}${fmtSmart(d)}</td>
    <td><span class="badge ${isUp?'badge-green':'badge-red'}">${isUp?'↑':'↓'} ${Math.abs(dp2*100).toFixed(1)}%</span></td></tr>`;
  };
  const mkTotal=(arr,y1,y2)=>{
    const t1=arr.reduce((s,r)=>s+(r['تقييم_'+y1]||0),0);
    const t2=arr.reduce((s,r)=>s+(r['تقييم_'+y2]||0),0);
    const td=t2-t1, tdp=t1?td/t1:0, isUp=td>0;
    return `<tr style="background:#f0f4f8;font-weight:800;border-top:2px solid #cbd5e1">
      <td colspan="5" style="text-align:right;padding:9px 12px;font-size:12px">الإجمالي</td>
      <td class="num"><b>${fmtSmart(t1)}</b></td><td></td>
      <td class="num"><b>${fmtSmart(t2)}</b></td><td></td>
      <td class="num" style="color:${isUp?'#16a34a':'#dc2626'}"><b>${isUp?'+':''}${fmtSmart(td)}</b></td>
      <td><span class="badge ${isUp?'badge-green':'badge-red'}">${isUp?'↑':'↓'} ${Math.abs(tdp*100).toFixed(1)}%</span></td>
    </tr>`;
  };
  res.innerHTML=`
  <div class="kpi-grid">
    ${kpi('⬆️','قسائم ارتفعت', fmtN(up.length),  'من '+y1+' إلى '+y2,'#10b981')}
    ${kpi('⬇️','قسائم انخفضت',fmtN(dn.length),  'من '+y1+' إلى '+y2,'#f87171')}
    ${kpi('➡️','قسائم ثابتة', fmtN(same.length),'بدون تغيير','#94a3b8')}
    ${kpi('📊','إجمالي التغير',(diff>0?'+':'')+fmtSmart(diff),(dp*100).toFixed(1)+'% تغير','#3b82f6')}
  </div>
  ${up.length?`<div class="table-card"><div class="table-header"><h3>✅ القسائم المرتفعة (${up.length})</h3><button class="export-btn" onclick="exportPDF('tbl-up','القسائم المرتفعة')">📄 PDF</button></div>
  <div class="table-wrap"><table id="tbl-up">${head}<tbody>${up.map(mkRow).join('')}${mkTotal(up,y1,y2)}</tbody></table></div></div>`:''}
  ${dn.length?`<div class="table-card"><div class="table-header"><h3>🔻 القسائم المنخفضة (${dn.length})</h3><button class="export-btn" onclick="exportPDF('tbl-dn','القسائم المنخفضة')">📄 PDF</button></div>
  <div class="table-wrap"><table id="tbl-dn">${head}<tbody>${dn.map(mkRow).join('')}${mkTotal(dn,y1,y2)}</tbody></table></div></div>`:''}`;
}

function filterPort(uid,portKey,bySubPort){
  // أي تغيير في الفلتر العادي يلغي تصفية "الوحدات الخالية حسب الدور" النشطة (لتفادي عرض متضارب)
  const msMenu=document.getElementById('msMenu-'+uid);
  if(msMenu){ msMenu.querySelectorAll('input').forEach(cb=>cb.checked=false); msMenu.hidden=true; }
  const msBtn=document.getElementById('msBtn-'+uid); if(msBtn) msBtn.textContent='اختر الأدوار ▾';
  const msReset=document.getElementById('msReset-'+uid); if(msReset) msReset.style.display='none';

  const val=document.getElementById('flt-'+uid).value;
  let rows=RAW_DATA.filter(r=>r.محفظة===portKey);
  let isSingle=false;
  if(val){
    if(bySubPort){
      rows=rows.filter(r=>r.محفظة_فرعية===val);
      isSingle=true;
    } else {
      rows=rows.filter(r=>String(r.قسيمة)+(r.قطعة&&r.قطعة!==0?'/'+r.قطعة:'')===val||String(r.قسيمة)===val);
      isSingle=rows.length===1;
    }
  }
  const cfg=PORTFOLIOS.find(p=>p.key===portKey);
  renderPort(uid,portKey,rows,bySubPort,isSingle,cfg?cfg.color:'#3b82f6',portKey==='العارضية',!!val);
}

  ${(()=>{const fs=floorStats(rows);if(!fs.totalVac)return'';
    return `<div class="section-title" style="border-color:${color}">🏢 توزيع الوحدات الخالية حسب الأدوار</div>
    <div class="table-card"><div class="table-header"><h3>🏢 أين تتركز ${fmtN(fs.totalVac)} وحدة خالية داخل ${isFiltered?'التصفية الحالية':'محفظة '+portKey}</h3></div>
    <div style="padding:0 16px 10px;font-size:11px;color:var(--text3)">٪ أسفل كل رقم = نسبة الخالي لذلك الدور (خالي ÷ (خالي + مؤجر) لنفس الدور) — وعمود "٪ الخالي الإجمالية" لكل الأدوار معاً</div>
    <div class="table-wrap"><table>${floorTableHtml([{label:portKey,stats:fs}],Math.max(1,...FLOOR_COLS.map(f=>fs.totals[f]),fs.unknown),false)}</table></div></div>`;})()}
  ${!isSingle&&low4.length?`<div class="section-title" style="border-color:${color}">📉 قسائم بعائد ≤ 4%</div>
  <div class="table-card"><div class="table-header"><h3>🔴 قسائم العائد ≤ 4% (${low4.length})</h3><button class="export-btn" onclick="exportPDF('lo-${uid}','عائد ≤ 4%')">📄 PDF</button></div>
  <div class="table-wrap"><table id="lo-${uid}">${roiHead}<tbody>${low4.map(roiRow).join('')}</tbody></table></div></div>`:''}
  ${!isSingle&&high4.length?`<div class="section-title" style="border-color:${color}">📈 قسائم بعائد > 4%</div>
  <div class="table-card"><div class="table-header"><h3>🟢 قسائم العائد > 4% (${high4.length})</h3><button class="export-btn" onclick="exportPDF('hi-${uid}','عائد > 4%')">📄 PDF</button></div>
  <div class="table-wrap"><table id="hi-${uid}">${roiHead}<tbody>${high4.map(roiRow).join('')}</tbody></table></div></div>`:''}
  ${!isFiltered?`<div class="section-title" style="border-color:${color}">📋 كشف القسائم</div>
  <div class="table-card"><div class="table-header"><h3>📋 جميع قسائم ${portKey} (${rows.length})</h3><button class="export-btn" onclick="exportPDF('ls-${uid}','كشف قسائم ${portKey}')">📄 PDF</button></div>
  <div class="table-wrap"><table id="ls-${uid}">${listHead}<tbody>${rows.map(listRow).join('')}</tbody></table></div></div>`:''}`;
}

// ── تصفية الوحدات الخالية حسب الدور (قائمة منسدلة متعددة الاختيار) — سبتمبر 2026 ──
function toggleFloorMenu(uid){
  const menu=document.getElementById('msMenu-'+uid); if(!menu) return;
  const willOpen=menu.hidden;
  document.querySelectorAll('.ms-menu').forEach(m=>m.hidden=true);
  menu.hidden=!willOpen;
}
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.ms-wrap')) document.querySelectorAll('.ms-menu').forEach(m=>m.hidden=true);
});

function getSelectedFloors(uid){
  return [...document.querySelectorAll('#msMenu-'+uid+' input:checked')].map(cb=>cb.value);
}

// عند تغيير الاختيار في القائمة: إن وُجد اختيار واحد على الأقل، تختفي كل بيانات شاشة المحفظة
// ويظهر بدلاً منها جدول واحد بعرض الشاشة بالقسائم التي بها وحدات خالية في أي من الأدوار المختارة.
// عند إلغاء كل الاختيارات، تعود الشاشة لعرضها الطبيعي (filterPort بحسب الفلتر العادي الحالي).
function applyFloorFilter(uid,portKey){
  const sel=getSelectedFloors(uid);
  const btn=document.getElementById('msBtn-'+uid), reset=document.getElementById('msReset-'+uid);
  if(sel.length){
    btn.textContent=`${sel.length===1?'دور واحد مختار':sel.length+' أدوار مختارة'} ▾`;
    reset.style.display='';
    renderFloorFilterTable(uid,portKey,sel);
  } else {
    btn.textContent='اختر الأدوار ▾';
    reset.style.display='none';
    const cfg=PORTFOLIOS.find(p=>p.key===portKey);
    filterPort(uid,portKey,cfg?cfg.filterBySubPort:false);
  }
}

function clearFloorFilter(uid,portKey){
  const menu=document.getElementById('msMenu-'+uid);
  if(menu){ menu.querySelectorAll('input').forEach(cb=>cb.checked=false); menu.hidden=true; }
  applyFloorFilter(uid,portKey);
}

function renderFloorFilterTable(uid,portKey,sel){
  const el=document.getElementById('pc-'+uid); if(!el) return;
  const cfg=PORTFOLIOS.find(p=>p.key===portKey);
  const color=cfg?cfg.color:'#3b82f6';
  const rentCols=sel.map(f=>f+'_مؤجر');
  const rowAgg=r=>{ let vac=0,rent=0; sel.forEach((f,j)=>{ vac+=r[f]||0; rent+=r[rentCols[j]]||0; }); return {vac,rent}; };
  const rows=RAW_DATA.filter(r=>r.محفظة===portKey && sel.some(f=>(r[f]||0)>0))
    .sort((a,b)=>rowAgg(b).vac-rowAgg(a).vac);
  const selLabels=sel.map(f=>FLOOR_LABELS[f]).join('، ');

  if(!rows.length){
    el.innerHTML=`<div class="section-title" style="border-color:${color}">🔍 تصفية الوحدات الخالية حسب الدور</div>
    <div class="empty-state">🔍 لا توجد قسائم بها وحدات خالية في: ${selLabels}</div>`;
    return;
  }

  let totalVacSel=0, totalRentSel=0;
  const head=`<thead><tr><th>#</th><th>المحفظة الفرعية</th><th>القسيمة</th><th>القطعة</th>
    ${sel.map(f=>`<th>خالي ${FLOOR_LABELS[f]}</th>`).join('')}
    <th>إجمالي الخالي (الأدوار المختارة)</th><th>٪ الخالي (الأدوار المختارة)</th></tr></thead>`;
  const body=rows.map((r,i)=>{
    const cells=sel.map((f,j)=>{
      const v=r[f]||0, rc=r[rentCols[j]]||0, d=v+rc;
      const pct=d?fmtPct(v/d):'—';
      return `<td class="num"><div><b>${v?fmtN(v):'—'}</b></div><div style="font-size:10px;color:var(--text3)">${pct}</div></td>`;
    }).join('');
    const {vac:rowVac,rent:rowRent}=rowAgg(r);
    totalVacSel+=rowVac; totalRentSel+=rowRent;
    const rowPct=(rowVac+rowRent)?fmtPct(rowVac/(rowVac+rowRent)):'—';
    return `<tr>
      <td class="num">${i+1}</td><td>${r.محفظة_فرعية||'—'}</td>
      <td class="num"><b>${r.قسيمة||'—'}</b></td><td class="num">${r.قطعة||'—'}</td>
      ${cells}
      <td class="num"><b>${fmtN(rowVac)}</b></td><td class="num">${rowPct}</td>
    </tr>`;
  }).join('');
  const totalPct=(totalVacSel+totalRentSel)?fmtPct(totalVacSel/(totalVacSel+totalRentSel)):'—';

  el.innerHTML=`
  <div class="section-title" style="border-color:${color}">🔍 تصفية الوحدات الخالية حسب الدور</div>
  <div class="table-card"><div class="table-header"><h3>🏢 قسائم بها وحدات خالية في: ${selLabels} — ${rows.length} قسيمة، ${fmtN(totalVacSel)} وحدة خالية، ٪الخالي الإجمالي ${totalPct}</h3></div>
  <div class="table-wrap"><table>${head}<tbody>${body}</tbody></table></div></div>`;
}

// ── FADHA ────────────────────────────────────────────────────────────
function buildFadha(){
  const el=document.getElementById('screen-p_fadha');
  const rows=RAW_DATA.filter(r=>FADHA_KEYS.includes(r.محفظة));
  const s=portStats(rows);
  el.innerHTML=`
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <div class="portfolio-badge" style="color:#f97316;border-color:#f97316;background:rgba(249,115,22,.13)">🌿 أراضي فضاء والمنطقة الحرة</div>
    <button class="export-btn" onclick="exportPDF('tbl-fadha','أراضي فضاء والمنطقة الحرة')">📄 PDF</button>
  </div>
  <div class="kpi-grid">
    ${kpi('🗺️','إجمالي القسائم',    fmtN(rows.length),  'فضاء + منطقة حرة','#f97316')}
    ${kpi('💰','إجمالي القيمة 2025',fmtSmart(s.val),    'آخر تقييم','#10b981')}
    ${kpi('🔒','قسائم مرهونة',       fmtN(s.mortCount),  '','#f87171')}
  </div>
  <div class="table-card"><div class="table-header"><h3>📋 بيان الأراضي الفضاء والمنطقة الحرة (${rows.length})</h3></div>
  <div class="table-wrap"><table id="tbl-fadha">
    <thead><tr><th>#</th><th>المحفظة</th><th>المحفظة الفرعية</th><th>القسيمة</th><th>القطعة</th>
    <th>المساحة (م²)</th><th>تقييم 2025</th><th>اسم المقيم</th><th>وضع الرهن</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>
      <td class="num">${i+1}</td><td>${r.محفظة||'—'}</td><td>${r.محفظة_فرعية||'—'}</td>
      <td class="num"><b>${r.قسيمة||'—'}</b></td><td class="num">${r.قطعة||'—'}</td>
      <td class="num">${fmtN(r.مساحة)}</td>
      <td class="num"><b>${fmtSmart(r.تقييم_2025)}</b></td>
      <td>${r.مقيم_2025||'—'}</td>
      <td><span class="badge ${r.رهن==='مرهون'?'badge-red':'badge-green'}">${r.رهن||'—'}</span></td>
    </tr>`).join('')}</tbody>
  </table></div></div>`;
}

// ── PDF ──────────────────────────────────────────────────────────────
function exportPDF(tableId,title){
  const tbl=document.getElementById(tableId); if(!tbl){alert('الجدول غير موجود');return;}
  const w=window.open('','_blank','width=1000,height=700');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Cairo',sans-serif;font-size:11px;padding:20px}h2{font-size:14px;margin-bottom:8px}
  .meta{font-size:10px;color:#64748b;margin-bottom:14px}table{width:100%;border-collapse:collapse}
  th{background:#f0f4f8;padding:7px 10px;text-align:right;border:1px solid #cbd5e1;font-size:10px}
  td{padding:6px 10px;border:1px solid #e2e8f0;font-size:10px}tr:nth-child(even) td{background:#f8fafc}</style>
  </head><body><h2>📋 ${title}</h2>
  <div class="meta">تاريخ الإصدار: ${new Date().toLocaleDateString('ar-KW')} | داشبورد تحليل معلومات العقارات</div>
  ${tbl.outerHTML}<script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

// ── INIT ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('hdr-update-date').textContent=DATA_ASOF;
  buildMain();
  PORTFOLIOS.forEach(p=>buildPortfolio(p));
  buildFadha();
});
</script>
